# Single source of truth for the Dimster runtime version. Maven resource
# filtering (configured in dimster-core/pom.xml) substitutes ${project.version}
# at build time, so the value stamped here always matches the pom's parent
# version. The Version class reads this file at class-load time and exposes
# the value to anything that needs to record "what produced this artifact"
# — most importantly, the dimsterVersion field on every result JSON.
version=${project.version}
