name: Quick run test - linger.ms dimension

engineConfig:
  perPartitionMetrics: true
  perConsumerMetrics: true
  cooldownMinutes: 0

runConfig:
  testDurationMinutes: 1
  warmupDurationMinutes: 1

baseWorkload:
  topics: 1
  partitionsPerTopic: 2
  messageDistributor: "NO_KEY"
  messageSize: 1000
  consumerType: CONSUMER_GROUP
  consumerGroupsPerTopic: 1
  consumersPerGroup: 2
  producersPerTopic: 1
  producerRate: 2000
  kafkaConfig:
    replicationFactor: 3
    topicConfig:
      min.insync.replicas: 2
    classicConsumerConfig:
      auto.offset.reset: earliest
    producerConfig:
      acks: all

scenarios:
  - name: linger-ms
    label: ["linger-0ms", "linger-50ms"]
    kafkaConfig:
      producerConfig:
        linger.ms: [0, 50]
