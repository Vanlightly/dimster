name: single-broker

# Single-broker Kafka server properties.
# Use this when deploying with kafka.replicas=1 (e.g. local development).
# All replication factors set to 1, share group coordinator included.
properties:
  num.partitions: 1
  default.replication.factor: 1
  min.insync.replicas: 1
  offsets.topic.replication.factor: 1
  transaction.state.log.replication.factor: 1
  transaction.state.log.min.isr: 1
  share.coordinator.state.topic.replication.factor: 1
  share.coordinator.state.topic.min.isr: 1
  socket.send.buffer.bytes: 131072
  socket.receive.buffer.bytes: 131072
  socket.request.max.bytes: 104857600
  log.retention.hours: 1
  log.segment.bytes: 1073741824
  group.share.max.size: 1000
  group.share.max.record.lock.duration.ms: 180000
  group.share.max.share.sessions: 10000
