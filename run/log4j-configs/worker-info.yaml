name: worker-info

# Dimster worker log4j2 properties (log4j2 properties syntax — workers run
# log4j2, unlike Kafka brokers which still use log4j 1.x).
#
# Mirrors the bundled default at dimster-core/src/main/resources/log4j2.yaml:
# root INFO, org.apache.kafka WARN, console + rolling file appender writing
# to ${DIMSTER_LOG_FILE:-/tmp/dimster.log}. The deploy command flattens this
# map into a pipe-separated WORKER_LOG4J_CONFIG env var; the worker entrypoint
# writes it back out as /tmp/log4j2.properties and points the JVM at it.
properties:
  status: "info"
  name: "worker-info"

  rootLogger.level: "info"
  rootLogger.appenderRefs: "console, file"
  rootLogger.appenderRef.console.ref: "Console"
  rootLogger.appenderRef.file.ref: "File"

  appender.console.type: "Console"
  appender.console.name: "Console"
  appender.console.target: "SYSTEM_OUT"
  appender.console.layout.type: "PatternLayout"
  appender.console.layout.pattern: "%d{HH:mm:ss.SSS} %-4level: %msg%n"

  # Don't change the filename or filePattern
  appender.file.type: "RollingFile"
  appender.file.name: "File"
  appender.file.fileName: "${env:DIMSTER_LOG_FILE:-/tmp/dimster.log}"
  appender.file.filePattern: "${env:DIMSTER_LOG_FILE:-/tmp/dimster.log}.%i.gz"
  appender.file.layout.type: "PatternLayout"
  appender.file.layout.pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-4level: %msg%n"
  appender.file.policies.type: "Policies"
  appender.file.policies.size.type: "SizeBasedTriggeringPolicy"
  appender.file.policies.size.size: "50 MB"
  appender.file.strategy.type: "DefaultRolloverStrategy"
  appender.file.strategy.max: "5"

  logger.kafka.name: "org.apache.kafka"
  logger.kafka.level: "warn"
  logger.kafka.additivity: "false"
  logger.kafka.appenderRefs: "console, file"
  logger.kafka.appenderRef.console.ref: "Console"
  logger.kafka.appenderRef.file.ref: "File"
