name: debug

# Kafka broker log4j properties.
# Enables DEBUG logging for all org.apache.kafka classes.
properties:
  log4j.rootLogger: "INFO, stdout, serverFile"
  log4j.appender.stdout: "org.apache.log4j.ConsoleAppender"
  log4j.appender.stdout.layout: "org.apache.log4j.PatternLayout"
  log4j.appender.stdout.layout.ConversionPattern: "[%d] %p %m (%c)%n"
  log4j.appender.serverFile: "org.apache.log4j.RollingFileAppender"
  log4j.appender.serverFile.File: "/opt/kafka/logs/server.log"
  log4j.appender.serverFile.MaxFileSize: "100MB"
  log4j.appender.serverFile.MaxBackupIndex: "5"
  log4j.appender.serverFile.layout: "org.apache.log4j.PatternLayout"
  log4j.appender.serverFile.layout.ConversionPattern: "[%d] %p %m (%c)%n"
  log4j.logger.kafka: "INFO"
  log4j.logger.org.apache.kafka: "DEBUG"
