apiVersion: v1
kind: Service
metadata:
  name: benchmark-worker
  namespace: dimster
  labels:
    app: benchmark-worker
spec:
  clusterIP: None
  selector:
    app: benchmark-worker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics-bk
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 9090
      targetPort: 9090
