apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: dimster
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: 'benchmark-workers'
        dns_sd_configs:
          - names:
              - 'benchmark-worker.dimster.svc.cluster.local'
            type: A
            port: 9090

      - job_name: 'kafka-jmx'
        dns_sd_configs:
          - names:
              - 'kafka-headless.dimster.svc.cluster.local'
            type: A
            port: 9404

      - job_name: 'node-exporter'
        dns_sd_configs:
          - names:
              - 'node-exporter.dimster.svc.cluster.local'
            type: A
            port: 9100
