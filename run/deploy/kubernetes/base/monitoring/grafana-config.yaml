apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: dimster
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.dimster.svc.cluster.local:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: dimster
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'dimster'
        orgId: 1
        folder: 'Dimster'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
      - name: 'dimster-system'
        orgId: 1
        folder: 'Dimster'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards-system
          foldersFromFilesStructure: false
