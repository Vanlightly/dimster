apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: dimster
data:
  server.properties: |
    # KRaft mode settings
    process.roles=broker,controller
    node.id=${NODE_ID}
    controller.quorum.voters=${CONTROLLER_QUORUM_VOTERS}
    controller.listener.names=CONTROLLER

    # Listeners
    listeners=PLAINTEXT://:9092,CONTROLLER://:9093
    advertised.listeners=PLAINTEXT://${ADVERTISED_HOSTNAME}:9092
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT

    # Log dirs
    log.dirs=/var/kafka-data/kafka-logs

    # Defaults
    num.partitions=1
    default.replication.factor=3
    min.insync.replicas=2
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2

    # Performance (num.network.threads and num.io.threads set by entrypoint based on CPU)
    socket.send.buffer.bytes=131072
    socket.receive.buffer.bytes=131072
    socket.request.max.bytes=104857600

    # Log retention
    log.retention.hours=1
    log.segment.bytes=1073741824

  entrypoint.sh: |
    #!/bin/bash
    set -e

    NODE_ID=${HOSTNAME##*-}

    # Build controller quorum voters string from replicas count
    REPLICAS=${KAFKA_REPLICAS:-3}
    VOTERS=""
    for i in $(seq 0 $((REPLICAS - 1))); do
      if [ -n "$VOTERS" ]; then
        VOTERS="${VOTERS},"
      fi
      VOTERS="${VOTERS}${i}@kafka-${i}.kafka-headless.dimster.svc.cluster.local:9093"
    done

    ADVERTISED_HOSTNAME="kafka-${NODE_ID}.kafka-headless.dimster.svc.cluster.local"

    # Generate server.properties from template
    sed -e "s|\${NODE_ID}|${NODE_ID}|g" \
        -e "s|\${CONTROLLER_QUORUM_VOTERS}|${VOTERS}|g" \
        -e "s|\${ADVERTISED_HOSTNAME}|${ADVERTISED_HOSTNAME}|g" \
        /opt/kafka-config/server.properties > /tmp/server.properties

    # Set thread counts based on CPU (1 network thread per core, 2 IO threads per core, min 3/8)
    CPUS=${KAFKA_CPU:-4}
    NET_THREADS=$((CPUS > 3 ? CPUS : 3))
    IO_THREADS=$((CPUS * 2 > 8 ? CPUS * 2 : 8))
    echo "" >> /tmp/server.properties
    echo "num.network.threads=${NET_THREADS}" >> /tmp/server.properties
    echo "num.io.threads=${IO_THREADS}" >> /tmp/server.properties

    # Append any extra config (comma-separated key=value pairs)
    if [ -n "${KAFKA_EXTRA_CONFIG:-}" ]; then
      echo "" >> /tmp/server.properties
      echo "$KAFKA_EXTRA_CONFIG" | tr ',' '\n' >> /tmp/server.properties
    fi

    # mTLS lines (pipe-separated key=value pairs). Pipe — not comma —
    # because some SSL property values legitimately contain commas
    # (e.g. ssl.enabled.protocols=TLSv1.2,TLSv1.3). The deploy command
    # builds these lines from cli/src/commands/kafka_tls.rs so the
    # listeners/advertised.listeners overrides land AFTER the base config,
    # making Kafka pick up the SSL listener.
    if [ -n "${KAFKA_TLS_CONFIG:-}" ]; then
      echo "" >> /tmp/server.properties
      echo "$KAFKA_TLS_CONFIG" | tr '|' '\n' \
        | sed -e "s|\${ADVERTISED_HOSTNAME}|${ADVERTISED_HOSTNAME}|g" \
        >> /tmp/server.properties
    fi

    # Custom log4j config (pipe-separated key=value pairs)
    if [ -n "${KAFKA_LOG4J_CONFIG:-}" ]; then
      echo "$KAFKA_LOG4J_CONFIG" | tr '|' '\n' > /tmp/log4j.properties
      export KAFKA_LOG4J_OPTS="-Dlog4j.configuration=file:/tmp/log4j.properties"
      echo "Using custom log4j config:"
      cat /tmp/log4j.properties
    fi

    CLUSTER_ID=${KAFKA_CLUSTER_ID:-"dimster-benchmark-cluster-001"}
    DATA_DIR="/var/kafka-data/kafka-logs"

    # Format storage if not already formatted
    if [ ! -f "$DATA_DIR/meta.properties" ]; then
      /opt/kafka/bin/kafka-storage.sh format \
        --config /tmp/server.properties \
        --cluster-id "$CLUSTER_ID" \
        --ignore-formatted
    fi

    exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
