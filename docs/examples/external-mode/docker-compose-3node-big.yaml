# Three-node KRaft Kafka cluster for local benchmarking via Dimster's
# external deploy mode. All three nodes are combined broker+controller.
#
# Listener layout per node:
#   CONTROLLER (9093): KRaft quorum traffic. Never advertised to clients.
#   INTERNAL   (9092): inter-broker traffic over the docker network. Advertised
#                      using the docker service name (kafka1/kafka2/kafka3) so
#                      brokers can reach each other.
#   EXTERNAL   (1909X): client traffic from outside the docker network.
#                      Advertised as host.minikube.internal with a unique host
#                      port per broker (19092 / 19192 / 19292) so the bootstrap
#                      metadata response routes each client connection to the
#                      correct container.
#
# For Docker Desktop's built-in Kubernetes, replace host.minikube.internal with
# host.docker.internal. For laptop-side CLI tools (kafka-topics, etc.), either
# add a `127.0.0.1 host.minikube.internal` entry to /etc/hosts or run the CLI
# from a pod inside the cluster.
services:
  # Each broker is capped at 2 CPUs and 3 GiB so the three of them fit comfortably
  # in an 8 CPU / 11 GiB colima VM with headroom for client JVMs (producer/consumer
  # processes started via `docker exec` run inside the broker's cgroup, so the
  # 3 GiB limit must cover broker JVM + any per-broker client load). KAFKA_HEAP_OPTS
  # pins the JVM heap at 1 GiB so OS/page-cache use stays predictable inside the
  # mem_limit; without this the broker defaults to 1 GiB heap but could spike under
  # share-group load and trigger the OOM killer (exit 137).
  kafka1:
    image: apache/kafka:4.2.0
    container_name: kafka1
    cpus: '3'
    mem_limit: 4g
    mem_reservation: 1500m
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://host.minikube.internal:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"

  kafka2:
    image: apache/kafka:4.2.0
    container_name: kafka2
    cpus: '3'
    mem_limit: 4g
    mem_reservation: 1500m
    ports:
      - "19192:19192"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19192,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9092,EXTERNAL://host.minikube.internal:19192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"

  kafka3:
    image: apache/kafka:4.2.0
    container_name: kafka3
    cpus: '3'
    mem_limit: 4g
    mem_reservation: 1500m
    ports:
      - "19292:19292"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19292,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9092,EXTERNAL://host.minikube.internal:19292
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
