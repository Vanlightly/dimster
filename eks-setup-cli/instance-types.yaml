# AWS EC2 instance type specifications
# Used by eks-setup to suggest heap, CPU, and memory defaults.
# Add new instance types here — no recompilation needed.
# ebsBandwidthMBs = EBS baseline bandwidth in MB/s
# networkBaselineGbps = network baseline bandwidth in Gbps (from AWS API)

# Burstable — t3 (EBS only, good for infra/monitoring nodes)
t3.medium:  { vcpu: 2, memoryGib: 4,  arch: x86_64, ebsBandwidthMBs: 43,   networkBaselineGbps: 0.256 }
t3.large:   { vcpu: 2, memoryGib: 8,  arch: x86_64, ebsBandwidthMBs: 87,   networkBaselineGbps: 0.512 }
t3.xlarge:  { vcpu: 4, memoryGib: 16, arch: x86_64, ebsBandwidthMBs: 87,   networkBaselineGbps: 1.024 }

# Compute optimized — c7i / c7g (EBS only, good for infra/monitoring nodes)
